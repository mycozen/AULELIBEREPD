<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aule Libere UniPD</title>
  <style>
    :root {
      --bg: #090c15;
      --card: rgba(20, 26, 43, 0.72);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-2: #e11d48;
      --free: #10b981;
      --free-bg: rgba(16, 185, 129, 0.14);
      --busy: rgba(148, 163, 184, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(139, 92, 246, 0.18), transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(225, 29, 72, 0.14), transparent 36%),
        var(--bg);
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f8fafc, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .badge-status {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--free);
      box-shadow: 0 0 8px var(--free);
    }

    .dot.loading { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .dot.error { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      margin-bottom: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select, button {
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(9, 12, 21, 0.75);
      color: var(--text);
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .secondary-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
    }

    .toggle-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .building-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
    }

    .building-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .building-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .count-pill {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--free-bg);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }

    .room-row {
      display: grid;
      grid-template-columns: minmax(180px, 240px) 1fr;
      gap: 14px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(9, 12, 21, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.08);
      margin-bottom: 8px;
    }

    .room-row:last-child { margin-bottom: 0; }

    @media (max-width: 720px) {
      .room-row { grid-template-columns: 1fr; gap: 8px; }
    }

    .room-name { font-weight: 600; font-size: 0.95rem; }
    .room-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .now-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.73rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--free-bg);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.28);
    }

    .slots-area { display: flex; flex-direction: column; gap: 8px; }

    .timeline {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: var(--busy);
      overflow: hidden;
    }

    .timeline-free {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 4px;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: -4px;
    }

    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

    .slot-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.28);
      color: #a7f3d0;
    }

    .empty-state {
      text-align: center;
      padding: 42px 20px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Aule Libere UniPD</h1>
        <div class="subtitle">Finestre libere durante la giornata divise per edificio</div>
      </div>
      <div class="badge-status">
        <span id="status-dot" class="dot loading"></span>
        <span id="status-text">Caricamento dati...</span>
      </div>
    </header>

    <section class="panel">
      <div class="filters-grid">
        <div class="field">
          <label for="f-date">Giorno</label>
          <select id="f-date"></select>
        </div>

        <div class="field">
          <label for="f-building">Edificio / Sede</label>
          <select id="f-building">
            <option value="__ALL__">Tutti gli edifici</option>
          </select>
        </div>

        <div class="field">
          <label for="f-search">Cerca aula o edificio</label>
          <input id="f-search" type="text" placeholder="Es. Paolotti, Fisica, Aula A..." />
        </div>

        <div class="field">
          <label for="f-mingap">Durata minima slot</label>
          <select id="f-mingap">
            <option value="15">Almeno 15 min</option>
            <option value="30" selected>Almeno 30 min</option>
            <option value="60">Almeno 1 ora</option>
            <option value="90">Almeno 1 ora e 30</option>
            <option value="120">Almeno 2 ore</option>
          </select>
        </div>
      </div>

      <div class="secondary-bar">
        <div class="toggle-group">
          <label class="checkbox-label">
            <input id="f-only-time" type="checkbox" />
            <span>Solo libere alle:</span>
          </label>
          <input id="f-time" type="time" style="padding: 5px 9px; font-size: 0.84rem;" />
        </div>

        <div id="summary-counter" style="color: var(--muted); font-size: 0.82rem;"></div>
      </div>
    </section>

    <main id="results"></main>
  </div>

  <script>
    const DAY_START = 8 * 60;       // 08:00
    const DAY_END = 19 * 60 + 30;   // 19:30

    let dataset = null;

    const $ = (id) => document.getElementById(id);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const toMin = (t) => {
      const m = String(t || '').match(/(\d{1,2}):(\d{2})/);
      return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
    };

    const fromMin = (m) =>
      `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

    const formatItalianDay = (isoDate) => {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffDays = Math.round((dt - today) / 86400000);

      const label = dt.toLocaleDateString('it-IT', {
        weekday: 'long',
        day: '2-digit',
        month: 'long'
      });
      const capLabel = label.charAt(0).toUpperCase() + label.slice(1);
      if (diffDays === 0) return `Oggi • ${capLabel}`;
      if (diffDays === 1) return `Domani • ${capLabel}`;
      return capLabel;
    };

    function computeFreeSlots(busyIntervals, minGap) {
      const clamped = (busyIntervals || [])
        .map(([s, e]) => [Math.max(DAY_START, s), Math.min(DAY_END, e)])
        .filter(([s, e]) => e > s)
        .sort((a, b) => a[0] - b[0]);

      const merged = [];
      for (const cur of clamped) {
        if (!merged.length || cur[0] > merged[merged.length - 1][1]) {
          merged.push([...cur]);
        } else {
          merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], cur[1]);
        }
      }

      const free = [];
      let cursor = DAY_START;
      for (const [s, e] of merged) {
        if (s - cursor >= minGap) free.push([cursor, s]);
        cursor = Math.max(cursor, e);
      }
      if (DAY_END - cursor >= minGap) free.push([cursor, DAY_END]);
      return free;
    }

    function render() {
      if (!dataset) return;

      const selectedDate = $('f-date').value;
      const selectedBuilding = $('f-building').value;
      const query = $('f-search').value.trim().toLowerCase();
      const minGap = parseInt($('f-mingap').value, 10) || 30;
      const onlyAtTime = $('f-only-time').checked;
      const targetMin = toMin($('f-time').value);
      const totalSpan = DAY_END - DAY_START;

      const daySchedule = dataset.schedule[selectedDate] || {};
      let totalFreeRooms = 0;

      const filteredBuildings = dataset.buildings
        .filter((b) => selectedBuilding === '__ALL__' || b.id === selectedBuilding)
        .map((b) => {
          const buildingMatch = !query || b.name.toLowerCase().includes(query);
          const rooms = daySchedule[b.id] || [];

          const freeRooms = rooms
            .map((r) => {
              const slots = computeFreeSlots(r.busy, minGap);
              const activeSlot = targetMin !== null
                ? slots.find(([s, e]) => targetMin >= s && targetMin < e)
                : null;
              return { ...r, slots, activeSlot };
            })
            .filter((r) => {
              if (!r.slots.length) return false;
              if (onlyAtTime && !r.activeSlot) return false;
              if (!buildingMatch && !r.name.toLowerCase().includes(query)) return false;
              return true;
            });

          totalFreeRooms += freeRooms.length;
          return { ...b, freeRooms };
        })
        .filter((b) => b.freeRooms.length > 0);

      $('summary-counter').textContent =
        `${totalFreeRooms} ${totalFreeRooms === 1 ? 'aula libera' : 'aule libere'} in ${filteredBuildings.length} ${filteredBuildings.length === 1 ? 'edificio' : 'edifici'}`;

      if (!filteredBuildings.length) {
        $('results').innerHTML = `
          <div class="empty-state">
            Nessuna aula libera trovata per i filtri impostati.<br>
            <span style="font-size:0.82rem;">Prova a ridurre la durata minima dello slot o a cambiare edificio.</span>
          </div>`;
        return;
      }

      $('results').innerHTML = filteredBuildings.map((b) => `
        <section class="building-card">
          <div class="building-header">
            <div class="building-title">${esc(b.name)}</div>
            <div class="count-pill">${b.freeRooms.length} ${b.freeRooms.length === 1 ? 'aula libera' : 'aule libere'}</div>
          </div>

          ${b.freeRooms.map((r) => `
            <div class="room-row">
              <div>
                <div class="room-name">${esc(r.name)}</div>
                ${r.cap ? `<div class="room-meta">Capienza: ${esc(r.cap)} posti</div>` : ''}
                ${r.activeSlot ? `<div class="now-badge">Libera fino alle ${fromMin(r.activeSlot[1])}</div>` : ''}
              </div>

              <div class="slots-area">
                <div class="timeline" title="Barra giornata 08:00 – 19:30 (verde = libera)">
                  ${r.slots.map(([s, e]) => {
                    const left = ((s - DAY_START) / totalSpan) * 100;
                    const width = ((e - s) / totalSpan) * 100;
                    return `<div class="timeline-free" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;"></div>`;
                  }).join('')}
                </div>
                <div class="timeline-labels">
                  <span>08:00</span>
                  <span>11:00</span>
                  <span>14:00</span>
                  <span>17:00</span>
                  <span>19:30</span>
                </div>
                <div class="chips-wrap">
                  ${r.slots.map(([s, e]) => `<span class="slot-chip">${fromMin(s)} – ${fromMin(e)}</span>`).join('')}
                </div>
              </div>
            </div>
          `).join('')}
        </section>
      `).join('');
    }

    async function init() {
      const now = new Date();
      $('f-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      try {
        const res = await fetch(`./aule.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        dataset = await res.json();

        $('status-dot').className = 'dot';
        $('status-text').textContent = `Aggiornato al ${dataset.generated_at}`;

        const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        $('f-date').innerHTML = dataset.dates
          .map((d) => `<option value="${esc(d)}" ${d === todayIso ? 'selected' : ''}>${esc(formatItalianDay(d))}</option>`)
          .join('');

        $('f-building').innerHTML =
          `<option value="__ALL__">Tutti gli edifici (${dataset.buildings.length})</option>` +
          dataset.buildings.map((b) => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');

        render();
      } catch (err) {
        $('status-dot').className = 'dot error';
        $('status-text').textContent = 'File aule.json non ancora pronto';
        $('results').innerHTML = `
          <div class="empty-state">
            <strong>Il file <code>aule.json</code> non è ancora stato generato.</strong><br>
            Vai nella scheda <strong>Actions</strong> del tuo repository GitHub, verifica che il workflow <em>Aggiorna Aule Libere UniPD</em> abbia completato la prima esecuzione (richiede ~15 secondi) e ricarica questa pagina.
          </div>`;
      }
    }

    $('f-date').onchange = render;
    $('f-building').onchange = render;
    $('f-search').oninput = render;
    $('f-mingap').onchange = render;
    $('f-only-time').onchange = render;
    $('f-time').oninput = () => {
      if ($('f-only-time').checked) render();
    };

    init();
  </script>
</body>
</html>
